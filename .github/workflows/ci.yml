name: Continuous Integration
on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-@@{{ github.workflow }}-@@{{ github.ref }}
  cancel-in-progress: true
jobs:
  python-quality:
    name: Python @@{{ matrix.python-version }} · quality and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: @@{{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=python_hub --cov-report=term-missing
  package-build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade build
          python -m build
